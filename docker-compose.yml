services:
  portfolio:
    build: .
    container_name: portfolio
    restart: unless-stopped
    ports:
      # Change the left side to whatever port your Nginx reverse proxy targets.
      - "8088:3000"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/status"]
      interval: 60s
      timeout: 5s
      retries: 3
